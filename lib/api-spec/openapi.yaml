openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HydroHeat AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cities
    description: City and climate data
  - name: simulation
    description: Simulation and interventions
  - name: geo
    description: Geo-spatial intelligence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cities:
    get:
      operationId: getCities
      tags: [cities]
      summary: Get all cities
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
  /cities/{cityId}:
    get:
      operationId: getCityById
      tags: [cities]
      summary: Get city by ID
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: City details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
  /simulation/calculate:
    post:
      operationId: calculateSimulation
      tags: [simulation]
      summary: Calculate simulation with interventions and geo context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
  /simulation/auto-optimize:
    post:
      operationId: autoOptimize
      tags: [simulation]
      summary: AI auto-optimize city interventions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoOptimizeRequest"
      responses:
        "200":
          description: Recommended interventions and rationale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoOptimizeResult"
  /smart-zones/{cityId}:
    get:
      operationId: getSmartZones
      tags: [geo]
      summary: Get smart city zone analysis
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Smart zone analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartZonesResult"
  /geo-analysis/{lat}/{lng}:
    get:
      operationId: getGeoAnalysis
      tags: [geo]
      summary: Get geo-spatial intelligence for coordinates
      description: >
        Returns ISRO-style satellite analysis including NDVI vegetation index,
        water body detection, LULC classification, real weather data from Open-Meteo,
        and geo-contextual simulation modifiers.
      parameters:
        - name: lat
          in: path
          required: true
          schema:
            type: number
        - name: lng
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Geo-spatial analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAnalysis"
  /weather/{lat}/{lng}:
    get:
      operationId: getWeather
      tags: [cities]
      summary: Get local weather for coordinates
      parameters:
        - name: lat
          in: path
          required: true
          schema:
            type: number
        - name: lng
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Local weather data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherData"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    City:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        lat:
          type: number
        lng:
          type: number
        temperature:
          type: number
        groundwater:
          type: number
        riskScore:
          type: number
        population:
          type: number
        heatIslandIntensity:
          type: number
        airQualityIndex:
          type: number
        humidity:
          type: number
        rainfall:
          type: number
        waterWastageIndex:
          type: number
          description: Water wastage index 0-100 (100 = severe)
        contaminationLevel:
          type: number
          description: Groundwater contamination level 0-100
        infrastructureStress:
          type: number
          description: Infrastructure stress score 0-100
        skyskraperDensity:
          type: number
          description: High-rise building density percent 0-100
        sustainabilityScore:
          type: number
          description: Urban sustainability score 0-100 (100 = most sustainable)
        sewerageSystemHealth:
          type: number
          description: Sewerage system health 0-100
        floodRiskScore:
          type: number
          description: Flood risk score 0-100
        populationDensity:
          type: number
          description: Population density persons per km²
      required:
        - id
        - name
        - state
        - lat
        - lng
        - temperature
        - groundwater
        - riskScore
        - population
        - heatIslandIntensity
        - airQualityIndex
        - humidity
        - rainfall
        - waterWastageIndex
        - contaminationLevel
        - infrastructureStress
        - skyskraperDensity
        - sustainabilityScore
        - sewerageSystemHealth
        - floodRiskScore
        - populationDensity
    Intervention:
      type: object
      properties:
        type:
          type: string
          enum: [tree, fountain, solar, green_roof, permeable_pavement, factory, stubble_burning, fireworks, sewage_treatment, water_tank, cool_road, rainfall_harvesting]
        lat:
          type: number
        lng:
          type: number
        count:
          type: integer
          default: 1
      required:
        - type
        - lat
        - lng
    InterventionType:
      type: string
      enum: [tree, fountain, solar, green_roof, permeable_pavement, factory, stubble_burning, fireworks, sewage_treatment, water_tank, cool_road, rainfall_harvesting]
    SimulationRequest:
      type: object
      properties:
        cityId:
          type: string
        interventions:
          type: array
          items:
            $ref: "#/components/schemas/Intervention"
        geoContext:
          $ref: "#/components/schemas/GeoSimulationContext"
      required:
        - cityId
        - interventions
    GeoSimulationContext:
      type: object
      description: Optional geo context to make physics-based adjustments
      properties:
        ndvi:
          type: number
        waterBodyDistanceKm:
          type: number
        landUseClass:
          type: string
        soilMoisturePercent:
          type: number
        urbanDensityPercent:
          type: number
        treeEffectivenessMultiplier:
          type: number
        permeablePavementEffectiveness:
          type: number
        groundwaterRechargePotential:
          type: number
      required:
        - ndvi
        - waterBodyDistanceKm
        - landUseClass
        - soilMoisturePercent
        - urbanDensityPercent
        - treeEffectivenessMultiplier
        - permeablePavementEffectiveness
        - groundwaterRechargePotential
    SimulationResult:
      type: object
      properties:
        cityId:
          type: string
        temperatureDelta:
          type: number
        groundwaterDelta:
          type: number
        riskScoreDelta:
          type: number
        airQualityDelta:
          type: number
        projectedTemperature:
          type: number
        projectedGroundwater:
          type: number
        projectedRiskScore:
          type: number
        waterWastageDelta:
          type: number
          description: Change in water wastage index
        contaminationDelta:
          type: number
          description: Change in contamination level
        infrastructureStressDelta:
          type: number
          description: Change in infrastructure stress
        floodRiskDelta:
          type: number
          description: Change in flood risk score
        sewageLeakageRate:
          type: number
          description: Estimated sewage leakage in liters per day per km
        aiInsights:
          type: array
          items:
            type: string
        interventionBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/InterventionEffect"
        geoAdjusted:
          type: boolean
          description: Whether geo context was applied to adjust physics
      required:
        - cityId
        - temperatureDelta
        - groundwaterDelta
        - riskScoreDelta
        - airQualityDelta
        - projectedTemperature
        - projectedGroundwater
        - projectedRiskScore
        - waterWastageDelta
        - contaminationDelta
        - infrastructureStressDelta
        - floodRiskDelta
        - sewageLeakageRate
        - aiInsights
        - interventionBreakdown
        - geoAdjusted
    InterventionEffect:
      type: object
      properties:
        type:
          type: string
        effect:
          type: string
        temperatureImpact:
          type: number
        groundwaterImpact:
          type: number
        contaminationImpact:
          type: number
        waterWastageImpact:
          type: number
      required:
        - type
        - effect
        - temperatureImpact
        - groundwaterImpact
        - contaminationImpact
        - waterWastageImpact
    AutoOptimizeRequest:
      type: object
      properties:
        cityId:
          type: string
        priority:
          type: string
          enum: [temperature, groundwater, air_quality, water_contamination, balanced]
          default: balanced
        maxInterventions:
          type: integer
          default: 8
      required:
        - cityId
    AutoOptimizeResult:
      type: object
      properties:
        cityId:
          type: string
        recommendedInterventions:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedIntervention"
        rationale:
          type: string
        projectedImpact:
          $ref: "#/components/schemas/ProjectedImpact"
      required:
        - cityId
        - recommendedInterventions
        - rationale
        - projectedImpact
    RecommendedIntervention:
      type: object
      properties:
        type:
          type: string
        count:
          type: integer
        reason:
          type: string
        priority:
          type: integer
      required:
        - type
        - count
        - reason
        - priority
    ProjectedImpact:
      type: object
      properties:
        temperatureDelta:
          type: number
        groundwaterDelta:
          type: number
        riskScoreDelta:
          type: number
        contaminationDelta:
          type: number
      required:
        - temperatureDelta
        - groundwaterDelta
        - riskScoreDelta
        - contaminationDelta
    SmartZonesResult:
      type: object
      properties:
        cityId:
          type: string
        zones:
          type: array
          items:
            $ref: "#/components/schemas/SmartZone"
        summary:
          type: string
      required:
        - cityId
        - zones
        - summary
    SmartZone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [high_skyscraper_density, low_vegetation, heat_island, high_runoff, sewage_risk, flood_zone, industrial_zone]
        lat:
          type: number
        lng:
          type: number
        radiusKm:
          type: number
        severity:
          type: string
          enum: [low, moderate, high, critical]
        insight:
          type: string
        recommendations:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - type
        - lat
        - lng
        - radiusKm
        - severity
        - insight
        - recommendations
    GeoAnalysis:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        ndvi:
          type: number
          description: Normalized Difference Vegetation Index (-1 to 1)
        ndviClass:
          type: string
          description: Vegetation classification
        ndviHealthScore:
          type: number
          description: Vegetation health 0-100
        nearestWaterBody:
          $ref: "#/components/schemas/WaterBodyInfo"
        waterBodyCount:
          type: integer
          description: Number of water bodies within 100km
        landUseClass:
          type: string
          description: ISRO LULC classification
        urbanDensityPercent:
          type: number
        soilType:
          type: string
        droughtIndex:
          type: number
          description: 0-100, higher = more drought-prone
        realWeather:
          $ref: "#/components/schemas/RealWeatherData"
        isroAnalysis:
          $ref: "#/components/schemas/ISROAnalysis"
        simulationModifiers:
          $ref: "#/components/schemas/SimulationModifiers"
        geoRecommendations:
          type: array
          items:
            type: string
        dataSource:
          type: string
          description: Data provenance note
      required:
        - lat
        - lng
        - ndvi
        - ndviClass
        - ndviHealthScore
        - waterBodyCount
        - landUseClass
        - urbanDensityPercent
        - soilType
        - droughtIndex
        - realWeather
        - isroAnalysis
        - simulationModifiers
        - geoRecommendations
        - dataSource
    WaterBodyInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        distanceKm:
          type: number
        influenceLevel:
          type: string
      required:
        - name
        - type
        - distanceKm
        - influenceLevel
    RealWeatherData:
      type: object
      properties:
        temperature:
          type: number
        humidity:
          type: number
        windSpeed:
          type: number
        precipitation:
          type: number
        cloudCover:
          type: number
        soilMoisturePercent:
          type: number
        evapotranspiration:
          type: number
        source:
          type: string
      required:
        - temperature
        - humidity
        - windSpeed
        - precipitation
        - cloudCover
        - soilMoisturePercent
        - evapotranspiration
        - source
    ISROAnalysis:
      type: object
      description: ISRO Bhuvan-style satellite data analysis
      properties:
        lulcClass:
          type: string
        lulcSubClass:
          type: string
        vegetationHealthIndex:
          type: number
        surfaceAlbedo:
          type: number
        evapotranspirationRate:
          type: number
        landsatBand:
          type: string
        carbonSequestrationKgPerHa:
          type: number
        soilErosionRisk:
          type: string
        floodRisk:
          type: string
        heatIslandCategory:
          type: string
      required:
        - lulcClass
        - lulcSubClass
        - vegetationHealthIndex
        - surfaceAlbedo
        - evapotranspirationRate
        - landsatBand
        - carbonSequestrationKgPerHa
        - soilErosionRisk
        - floodRisk
        - heatIslandCategory
    SimulationModifiers:
      type: object
      description: Physics multipliers derived from geo context
      properties:
        treeEffectivenessMultiplier:
          type: number
        permeablePavementEffectiveness:
          type: number
        groundwaterRechargePotential:
          type: number
        heatIslandSeverity:
          type: number
        solarEffectiveness:
          type: number
        factoryImpactMultiplier:
          type: number
      required:
        - treeEffectivenessMultiplier
        - permeablePavementEffectiveness
        - groundwaterRechargePotential
        - heatIslandSeverity
        - solarEffectiveness
        - factoryImpactMultiplier
    WeatherData:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        temperature:
          type: number
        humidity:
          type: number
        windSpeed:
          type: number
        windDirection:
          type: string
        conditions:
          type: string
        uvIndex:
          type: number
        feelsLike:
          type: number
        visibility:
          type: number
      required:
        - lat
        - lng
        - temperature
        - humidity
        - windSpeed
        - windDirection
        - conditions
        - uvIndex
        - feelsLike
        - visibility
