kind = "web"
previewPath = "/"
title = "HydroHeat AI"
version = "1.0.0"
id = "artifacts/hydroheat-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5180

[services.development]
run = "pnpm --filter @workspace/hydroheat-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hydroheat-ai", "run", "build" ]
publicDir = "artifacts/hydroheat-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5180"
BASE_PATH = "/"
